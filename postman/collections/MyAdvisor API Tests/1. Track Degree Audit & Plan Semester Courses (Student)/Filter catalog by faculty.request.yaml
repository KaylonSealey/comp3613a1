$kind: http-request
url: "{{baseUrl}}/api/courses?faculty=Mathematics"
method: GET
queryParams:
  faculty: Mathematics
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Only MATH1001 is in Mathematics", () => pm.expect(pm.response.json().map(c => c.code)).to.eql(["MATH1001"]));
    language: text/javascript
order: 3000
