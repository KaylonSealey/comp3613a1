$kind: http-request
url: "{{baseUrl}}/api/courses?query=data"
method: GET
queryParams:
  query: data
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Only COMP1002 matches \"data\"", () => pm.expect(pm.response.json().map(c => c.code)).to.eql(["COMP1002"]));
    language: text/javascript
order: 2000
