$kind: http-request
url: "{{baseUrl}}/api/me/plan/courses/{{removablePlanCourseId}}?academic_term=2026/27"
method: DELETE
queryParams:
  academic_term: 2026/27
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", () => pm.response.to.have.status(404));
      pm.test("Error message is correct", () => pm.expect(pm.response.json().detail).to.eql("That course is not in this plan."));
    language: text/javascript
order: 14000
