$kind: http-request
url: "{{baseUrl}}/api/courses"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      const courses = pm.response.json();
      pm.test("Catalog has 9 courses", () => pm.expect(courses).to.have.lengthOf(9));
      courses.forEach(c => pm.collectionVariables.set("course_" + c.code, c.id));
    language: text/javascript
order: 1000
