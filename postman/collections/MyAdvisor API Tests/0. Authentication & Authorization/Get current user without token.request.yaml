$kind: http-request
url: "{{baseUrl}}/api/auth/me"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", () => pm.response.to.have.status(401));
      pm.test("Response is JSON, not the HTML page", () => pm.response.to.be.json);
    language: text/javascript
order: 7000
