$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "advisor",
      "password": "advisorpass"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("Role is advisor", () => pm.expect(body.role).to.eql("advisor"));
      pm.collectionVariables.set("advisorToken", body.access_token);
    language: text/javascript
order: 2000
