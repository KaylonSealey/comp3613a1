$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "bob"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status code is 422", () => pm.response.to.have.status(422));
    language: text/javascript
order: 5000
