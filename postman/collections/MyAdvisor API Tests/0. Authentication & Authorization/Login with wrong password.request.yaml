$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "bob",
      "password": "wrongpass"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", () => pm.response.to.have.status(401));
      pm.test("Error message is correct", () => pm.expect(pm.response.json().detail).to.eql("Incorrect username or password"));
    language: text/javascript
order: 4000
