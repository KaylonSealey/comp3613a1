$kind: http-request
url: "{{baseUrl}}/api/users"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      const users = pm.response.json();
      pm.test("Lists the seeded users", () => pm.expect(users.map(u => u.username)).to.include.members(["bob", "admin", "advisor"]));
      pm.test("Passwords are not exposed", () => users.forEach(u => pm.expect(u).to.not.have.property("password")));
    language: text/javascript
order: 9000
