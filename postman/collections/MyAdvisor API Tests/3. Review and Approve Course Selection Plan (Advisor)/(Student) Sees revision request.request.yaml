$kind: http-request
url: "{{baseUrl}}/api/me/plan?academic_term=2026/27"
method: GET
queryParams:
  academic_term: 2026/27
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      const plan = pm.response.json();
      pm.test("Status and advisor notes are shown", () => { pm.expect(plan.status).to.eql("Revision Requested"); pm.expect(plan.advisor_notes).to.eql("Please add WRIT1001 to Year 1 - Semester 2."); });
    language: text/javascript
order: 8000
