$kind: http-request
url: "{{baseUrl}}/api/advisor/plans/{{planId}}/decision"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "decision": "reject",
      "notes": "No"
    }
auth:
  type: bearer
  credentials:
    token: "{{advisorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", () => pm.response.to.have.status(409));
      pm.test("Error message is correct", () => pm.expect(pm.response.json().detail).to.eql("Choose Approve Plan or Request Revisions."));
    language: text/javascript
order: 5000
