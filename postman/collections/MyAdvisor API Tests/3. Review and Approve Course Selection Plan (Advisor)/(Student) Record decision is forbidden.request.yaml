$kind: http-request
url: "{{baseUrl}}/api/advisor/plans/{{planId}}/decision"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "decision": "approve",
      "notes": ""
    }
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status code is 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 6000
