$kind: http-request
url: "{{baseUrl}}/api/me/plan/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "course_id": {{course_WRIT1001}},
      "academic_term": "2026/27",
      "placement": "Year 1 - Semester 2",
      "plan_length": 3
    }
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status code is 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 9000
