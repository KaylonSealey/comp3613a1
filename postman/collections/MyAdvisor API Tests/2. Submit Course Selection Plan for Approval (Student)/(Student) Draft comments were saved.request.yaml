$kind: http-request
url: "{{baseUrl}}/api/me/plan?academic_term=2026/27"
method: GET
queryParams:
  academic_term: 2026/27
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      pm.test("Notes are stored", () => pm.expect(pm.response.json().notes).to.eql("Please check my electives."));
    language: text/javascript
order: 2000
