$kind: http-request
url: "{{baseUrl}}/api/me/plan/submission"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "academic_term": "2026/27",
      "notes": ""
    }
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", () => pm.response.to.have.status(409));
      pm.test("Error message is correct", () => pm.expect(pm.response.json().detail).to.eql("Only draft or revision-requested plans can be submitted."));
    language: text/javascript
order: 6000
